name: playsteps
description: Daily play activities and milestone tracking for parents. No cloud, no accounts.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  confetti: ^0.7.0
  pdf: ^3.10.8
  printing: ^5.12.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
