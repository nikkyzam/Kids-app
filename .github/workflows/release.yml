name: Release

# One workflow, many apps. A tag names the app it releases:
#
#   playsteps-v1.2.0   ->  the PlaySteps flavor, version 1.2.0
#
# Each app has a GitHub Environment named after its id (Settings ->
# Environments) holding that app's own secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD,
# PLAY_STORE_SERVICE_ACCOUNT_JSON, SUPABASE_URL, SUPABASE_ANON_KEY.
# Same secret names everywhere, different values per app, so one app's
# release can never sign with or publish to another app's listing.
on:
  push:
    tags:
      - "*-v*.*.*"
  workflow_dispatch:
    inputs:
      app:
        description: App id (must match a flavor in lib/config/app_flavor.dart)
        required: true
        default: playsteps

jobs:
  resolve:
    name: Resolve app
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - id: app
        env:
          INPUT_APP: ${{ inputs.app }}
        run: |
          if [ -n "$INPUT_APP" ]; then
            app="$INPUT_APP"
          else
            app="${GITHUB_REF_NAME%%-v*}"
          fi
          if ! [[ "$app" =~ ^[a-z][a-z0-9]*$ ]]; then
            echo "::error::Cannot derive an app id from '$GITHUB_REF_NAME'. Tag as <app>-vX.Y.Z."
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  android:
    name: Android (AAB)
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.app }}
    # Job level, not step level: a step's own `env:` block is not in scope for
    # that step's `if:`, so the publish step's condition below was always
    # comparing an empty string against an empty string and skipping — even
    # with every secret set.
    env:
      PLAY_SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      APP: ${{ needs.resolve.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release.keystore
          EOF

      # Without these the shipped artifact has family sharing and receipt
      # verification switched off: SupabaseConfig.isConfigured is false, so
      # HttpReceiptVerifier finds no endpoint and the app falls back to the
      # local check. Absent secrets still build — that degradation is by
      # design — but a release build should not get it by accident.
      - name: Build App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          tool/build_app.sh "$APP" appbundle

      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          tool/build_app.sh "$APP" apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ env.APP }}
          path: |
            build/app/outputs/bundle/${{ env.APP }}Release/app-${{ env.APP }}-release.aab
            build/app/outputs/flutter-apk/app-${{ env.APP }}-release.apk
          if-no-files-found: error

      - name: Publish to Google Play (internal track)
        if: ${{ env.PLAY_SA_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || format('com.nikkyzam.{0}.app', env.APP) }}
          releaseFiles: build/app/outputs/bundle/${{ env.APP }}Release/app-${{ env.APP }}-release.aab
          track: internal
          status: completed

      - name: Clean up secrets
        if: always()
        run: rm -f android/key.properties android/app/release.keystore

  ios:
    name: iOS (build validation)
    # Not a pinned macos-14: its Xcode predates the StoreKit 2 APIs
    # in_app_purchase_storekit compiles against (winBackOffers,
    # eligibleWinBackOfferIDs), so the job failed on the plugin's own source
    # while ci.yml — which uses macos-latest — built the same commit fine.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A full App Store upload requires signing certificates and a provisioning
      # profile (e.g. via Fastlane Match). This job compiles the iOS app without
      # code signing to catch build breakage on every release tag. Wire up
      # signing + `xcrun altool`/Fastlane deliver here when secrets are available.
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

  github-release:
    name: GitHub Release
    needs: [resolve, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ needs.resolve.outputs.app }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.aab
            artifacts/*.apk
