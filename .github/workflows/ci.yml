name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.7

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      # Already covered by the run above; called out as its own step so a
      # layout regression reads as one in the CI log instead of being one
      # failure among five hundred.
      - name: Check the layout at the smallest supported screens
        run: flutter test test/screens/small_screen_layout_test.dart

      # CI runners are UTC, which has no daylight-saving transitions, so
      # date-arithmetic bugs around DST cannot surface there. Re-run the suite
      # in a DST timezone to catch them.
      - name: Run tests in a DST timezone
        run: flutter test
        env:
          TZ: America/New_York

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  verify-purchase-function:
    name: Receipt verifier (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinned. A floating v2.x resolved to a newer Deno whose TypeScript
          # libs rejected code that passed locally, and turned CI red with no
          # change to the code. Bump deliberately, alongside a local run.
          deno-version: "2.9.6"

      # The edge function decides whether a parent keeps what they paid for,
      # and it is the one piece of this repo that never runs under
      # `flutter test`.
      - name: Type-check
        run: deno check supabase/functions/verify-purchase/*.ts

      - name: Test
        run: deno test --allow-env supabase/functions/verify-purchase/

      - name: Verify formatting
        run: deno fmt --check supabase/functions/verify-purchase/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # androidx.browser/activity require compiling against SDK 36, which the
      # runner image does not necessarily ship with.
      - name: Install Android SDK 36
        run: |
          # sdkmanager is not on PATH on the runner image.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: flutter pub get

      # Release, not debug. Debug catches missing launcher icons, manifest
      # errors and Gradle misconfiguration — but it never runs R8, and
      # `minifyEnabled true` means every real build does. Shrinking is where a
      # reflection-heavy plugin (sqflite, in_app_purchase,
      # flutter_local_notifications) gets stripped and the app crashes on a
      # path no test covers. Finding that here costs five minutes; finding it
      # in a tagged release costs a rejected upload.
      #
      # Unsigned in the sense that matters: no key.properties exists here, so
      # build.gradle falls back to debug signing. Google Play rejects that.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Named for what it is. The previous name read like a shippable
          # artifact, and it was uploaded to Play, which rejected it for being
          # signed in debug mode. A Play-ready bundle comes from release.yml,
          # which has the keystore.
          name: android-smoke-test-apk-not-for-play
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Catches a missing Xcode project, bad Info.plist keys, and pod issues.
      - name: Build iOS
        run: flutter build ios --debug --no-codesign

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release
